const BOUNDARY = [
{t:"5条需先建载体、AI后接入",d:"№4会议材料汇总查阅、№13个人工作台、№16活动报名签到、№35消防日志采集、№37网络告警采集——需先建文档库/工作台/轻量应用/采集层（平台侧工作），载体就绪后AI接管分析与问答，不计入“开箱即用”承诺。"},
{t:"1条仅承诺部分自动化",d:"№34对赌/回购自动触发判断：被投企业（尤其非控股）经营数据可得性是最大不确定性；数据通道建立前只做“条款台账＋行权时限提醒＋人工对照”，不承诺自动触发判断。"},
{t:"“实时”预期按接口能力管理",d:"OA等若无实时推送能力，相关需求降级为T+1批量同步；方案按“接口→只读账号→定时导出→RPA”兜底档位承诺，汇报阶段不做超出接口能力的承诺。"}

<script>
// 领导版渲染逻辑：单页滚动（结论→专家卡片→准备清单→折叠附录）
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const byN = {}; ITEMS.forEach(i => byN[i.n] = i);
// 解析专家覆盖需求（含共享需求的域标注）
const suiteReqs = SUITES.map(s => ({ ...s, list: s.reqs.split(/[、,，]/).map(t => { t = t.trim(); const m = t.match(/(\d+)/); const note = t.match(/[（(](.+?)[）)]/); return { n: +m[1], note: note ? note[1] : "" }; }) }));
const reqSuites = {}; suiteReqs.forEach(s => s.list.forEach(r => { (reqSuites[r.n] = reqSuites[r.n] || []).push({ id: s.id, note: r.note }); }));
const gcount = list => { const c = {A:0,B:0,C:0,D:0}; [...new Set(list.map(r => r.n))].forEach(n => c[byN[n].b]++); return c; };
const gtext = c => ["A","B","C","D"].filter(k => c[k]).map(k => PLAIN[k] + " " + c[k]).join(" · ");

function renderHead(){
  const c = {A:0,B:0,C:0,D:0}; ITEMS.forEach(i => c[i.b]++);
  document.getElementById("sec-head").innerHTML = `
  <h2 class="sec">结论：38条需求 → 12个专家 → 三期落地</h2>
  <p class="hint">阅读路径：先看结论数字 → 再看12张专家卡片 → 带走一张浙数侧准备清单；明细在文末折叠附录。</p>
  <div class="stats">
    <div class="stat"><div class="num">38<small>条</small></div><div class="lab">需求点</div><div class="ext">7个部门征集、去重合并后口径</div></div>
    <div class="stat"><div class="num">12<small>个</small></div><div class="lab">待建专家 / 数字员工</div><div class="ext">同类需求归并，一专家覆盖一域</div></div>
    <div class="stat"><div class="num">8<small>项</small></div><div class="lab">共享底座</div><div class="ext">权限/知识库/督办/连接器等统一建设</div></div>
    <div class="stat"><div class="num">3<small>期</small></div><div class="lab">落地节奏</div><div class="ext">0-3月快赢 / 3-6月打通 / 6-12月协调类</div></div>
  </div>
  <div class="headline">${esc(HEADLINE)}</div>
  <div class="gradeline">
    ${["A","B","C","D"].map(k => `<div class="gtag g${k}"><span class="dot d${k}"></span>${PLAIN[k]}<b>${c[k]}</b>条</div>`).join("")}
  </div>
  <p class="hint">可行性为大白话口径：可直接做＝不依赖厂商接口；需先打通数据＝依赖OA/NC/党建平台等数据通道；需先建平台＝需先建应用或采集载体；逐条口径见附录A。</p>
  <div class="redlines">
    <div class="rl rl1"><b>底线一 · 权限靠系统隔离</b><p>每个身份能看到哪些数据，在数据访问层按身份裁剪；无权限内容在检索结果中不可见、全程留痕——不靠口头约定、不靠AI自觉。</p></div>
    <div class="rl rl2"><b>底线二 · 金额靠规则计算</b><p>强基指数、假期余额、审核金额、报表勾稽全部由规则引擎确定性计算；AI只负责解释与起草，不估算数字、不编造出处。</p></div>
  </div>
  <div class="boundary"><div class="bt">边界说明（汇报口径，不做超出能力的承诺）</div>
    ${BOUNDARY.map(b => `<div class="bi"><b>${esc(b.t)}：</b>${esc(b.d)}</div>`).join("")}
  </div>`;
}

function renderExperts(){
  document.getElementById("sec-experts").innerHTML = `
  <h2 class="sec">12个专家：覆盖哪些需求、核心能力、需要浙数配合什么</h2>
  <p class="hint">点击需求编号可查看该条需求原文与实现要点；蓝底块为需要浙数文化侧配合/提前准备的事项（业务需求单口径：找谁、要什么能力/资料、拿到什么答复），每条末尾附对应需求编号，负责人可按编号对照准备。</p>
  <div class="legend">${["A","B","C","D"].map(k => `<span><span class="dot d${k}"></span>${PLAIN[k]}</span>`).join("")}<span>· 圆点标在每条需求编号前</span></div>
  <div class="egrid">${suiteReqs.map(s => { const m = SUITE_META[s.id]; const c = gcount(s.list); return `
    <div class="ecard">
      <div class="eh"><span class="sid">${s.id}</span><span class="en">${esc(s.name)}</span><span class="ph ph${s.phase}">${["","一期","二期","三期"][s.phase]}</span></div>
      <div class="pos">${esc(m.pos)}</div>
      <div class="blk"><div class="bl">覆盖需求（${s.list.length}条次）</div>
        <div class="chips">${s.list.map(r => `<button class="rchip" onclick="openModal(${r.n})"><span class="dot d${byN[r.n].b}"></span><span class="nn">№${r.n}</span>${esc(byN[r.n].name)}${r.note ? `<span class="note">（${esc(r.note)}）</span>` : ""}</button>`).join("")}</div>
        <div class="gcount">${gtext(c)}</div>
      </div>
      <div class="blk"><div class="bl">核心能力</div><ul>${m.caps.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="blk coop"><div class="bl">需浙数文化配合 / 提前准备</div><ul>${m.coop.map(x => `<li>${esc(x.t)}<span class="rrefs">${x.r.map(n => `<button class="rn" onclick="openModal(${n})" title="查看需求№${n}原文">№${n}</button>`).join("")}</span></li>`).join("")}</ul></div>
    </div>`; }).join("")}
  </div>`;
}

function renderPrep(){
  document.getElementById("sec-prep").innerHTML = `
  <h2 class="sec">浙数文化侧准备总清单（12专家配合事项汇总去重）</h2>
  <p class="hint">会后带走的一张表：派给谁、先启动哪件；“对应需求”列标明每项准备服务的需求编号（点击可看原文），负责人按编号对照准备。<span class="pw pt0">P0</span>＝决定项目能否启动、建议立即指派；<span class="pw pt1">P1</span>＝对应期启动前完成即可。</p>
  ${PREP.map(g => `<div class="pgroup card"><div class="pg">${esc(g.g)}（${g.items.length}项）</div>
    <div class="tscroll"><table><thead><tr><th style="width:16%">准备事项</th><th style="width:36%">具体内容与交付物</th><th style="width:18%">对应需求</th><th style="width:16%">服务专家</th><th style="width:14%">优先级与时点</th></tr></thead>
    <tbody>${g.items.map(it => `<tr><td class="pw">${esc(it[0])}</td><td>${esc(it[1])}</td><td>${it[4] === "all" ? `<span class="mini">全部38条</span>` : it[4].map(n => `<button class="rn" onclick="openModal(${n})" title="查看需求№${n}原文">№${n}</button>`).join("")}</td><td>${esc(it[2])}</td><td class="pw ${it[3].startsWith("P0") ? "pt0" : "pt1"}">${esc(it[3])}</td></tr>`).join("")}</tbody></table></div>
  </div>`).join("")}`;
}

function renderAppendix(){
  document.getElementById("sec-appendix").innerHTML = `
  <h2 class="sec">附录（默认折叠，供业务同事对照明细）</h2>
  <p class="hint">领导汇报无需展开；业务同事可展开查自己提的那条需求、以及风险与待确认清单。</p>
  <details class="app" id="appA"><summary>附录A · 38条需求速查<span class="mini">点击展开 · 支持搜索 · 点行看六维分析</span></summary>
    <div class="appbody"><div class="tools"><input type="search" id="q" placeholder="搜索需求名称 / 关键词 / 部门…" oninput="filterReqs()"></div>
    <div class="tscroll"><table><thead><tr><th style="width:5%">№</th><th style="width:33%">需求名称</th><th style="width:17%">提出部门·条线</th><th style="width:27%">归属专家</th><th style="width:18%">可行性</th></tr></thead>
    <tbody id="reqtbody">${ITEMS.map(i => `<tr class="reqrow" onclick="openModal(${i.n})"><td>${i.n}</td><td>${esc(i.name)}</td><td>${esc(i.dept)}·${esc(i.line)}</td><td>${(reqSuites[i.n]||[]).map(s => SHORT[s.id]).join("、")}</td><td><span class="badge b${i.b}">${PLAIN[i.b]}</span></td></tr>`).join("")}</tbody></table></div>
    <p class="mini" id="reqcount" style="margin-top:8px"></p></div>
  </details>
  <details class="app" id="appB"><summary>附录B · 风险与待确认<span class="mini">${RISKS.length}项风险 · ${QUESTIONS.length}条待确认（可勾选跟进）</span></summary>
    <div class="appbody">
      <div class="blk" style="margin-top:12px"><div class="bl">主要风险与兜底</div>
      ${RISKS.map(r => `<div class="risk"><b>№${esc(r[0])} ${esc(r[1])}：</b>${esc(r[2])}</div>`).join("")}</div>
      <div class="blk" style="margin-top:14px"><div class="bl">待确认清单 <span class="mini" id="qdone">0/${QUESTIONS.length}</span></div>
      ${QUESTIONS.map((q,i) => `<div class="check"><input type="checkbox" id="ck${i}" onchange="ckTick(this)"><label for="ck${i}">${esc(q)}</label></div>`).join("")}</div>
    </div>
  </details>`;
  filterReqs();
}
function filterReqs(){
  const q = (document.getElementById("q").value || "").trim();
  let n = 0;
  ITEMS.forEach(i => {
    const hit = !q || (i.name + i.point + i.dept + i.line).includes(q);
    const rows = document.querySelectorAll("#reqtbody tr");
    rows[i.n - 1].style.display = hit ? "" : "none";
    if (hit) n++;
  });
  document.getElementById("reqcount").textContent = q ? `匹配 ${n} / 38 条` : "共 38 条 · 点击行查看原文与实现要点";
}
function ckTick(el){
  el.closest(".check").classList.toggle("done", el.checked);
  const done = document.querySelectorAll("#appB .check input:checked").length;
  document.getElementById("qdone").textContent = done + "/" + QUESTIONS.length;
}
function openModal(n){
  const i = byN[n];
  const ss = (reqSuites[n]||[]).map(s => SHORT[s.id] + (s.note ? "（" + s.note + "）" : "")).join("、");
  document.getElementById("mcontent").innerHTML = `
    <h3>№${i.n} ${esc(i.name)}</h3>
    <div class="meta">${esc(i.dept)} · ${esc(i.line)} ｜ 归属专家：${esc(ss)} ｜ <span class="badge b${i.b}">${PLAIN[i.b]}</span>${i.sens ? ` <span class="badge" style="background:#b91c1c">敏感</span>` : ""}</div>
    <div class="dim"><div class="dl">需求原文要点</div><div class="dc">${esc(i.point)}</div></div>
    <div class="dim"><div class="dl">可行性结论</div><div class="dc">${esc(i.feas)}</div></div>
    <div class="dim"><div class="dl">依赖输入</div><div class="dc">${esc(i.input)}</div></div>
    <div class="dim"><div class="dl">数据打通方式</div><div class="dc">${esc(i.connect)}</div></div>
    <div class="dim"><div class="dl">权限隔离设计</div><div class="dc">${esc(i.perm)}</div></div>`;
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
renderHead(); renderExperts(); renderPrep(); renderAppendix();</script>
</body></html>
